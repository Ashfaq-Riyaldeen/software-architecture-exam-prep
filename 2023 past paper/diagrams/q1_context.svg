<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700;fill:#222}.box{rx:8;ry:8;stroke-width:2}.person{fill:#08427b;stroke:#052e56}.system{fill:#1168bd;stroke:#0b4f8a}.external{fill:#666;stroke:#444}.label{font-size:16px;font-weight:700;fill:#fff}.tag{font-size:13px;fill:#fff}.desc{font-size:12px;fill:#fff}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeText{font-size:12px;fill:#222}</style></defs>
  <text x="750" y="52" text-anchor="middle" class="title">C4 Level 1 - Fuel Quota Management System Context</text>
  <rect x="80" y="130" width="280" height="110" class="box person"/><text x="220" y="164" text-anchor="middle" class="label">Vehicle Owner</text><text x="220" y="190" text-anchor="middle" class="tag">[Person]</text><text x="220" y="214" text-anchor="middle" class="desc">Registers vehicle and receives SMS</text>
  <rect x="80" y="340" width="280" height="105" class="box person"/><text x="220" y="374" text-anchor="middle" class="label">Fuel Station Owner</text><text x="220" y="400" text-anchor="middle" class="tag">[Person]</text><text x="220" y="424" text-anchor="middle" class="desc">Registers fuel station</text>
  <rect x="80" y="550" width="280" height="110" class="box person"/><text x="220" y="584" text-anchor="middle" class="label">Fuel Station Operator</text><text x="220" y="610" text-anchor="middle" class="tag">[Person]</text><text x="220" y="634" text-anchor="middle" class="desc">Scans QR and records pumped litres</text>
  <rect x="80" y="740" width="280" height="95" class="box person"/><text x="220" y="774" text-anchor="middle" class="label">Administrator</text><text x="220" y="800" text-anchor="middle" class="tag">[Person]</text><text x="220" y="824" text-anchor="middle" class="desc">Monitors operations</text>
  <rect x="560" y="360" width="390" height="145" class="box system"/><text x="755" y="397" text-anchor="middle" class="label">Fuel Quota Management System</text><text x="755" y="424" text-anchor="middle" class="tag">[Software System]</text><text x="755" y="450" text-anchor="middle" class="desc">Vehicle registration, QR generation, station</text><text x="755" y="470" text-anchor="middle" class="desc">registration, quota tracking, SMS notifications</text>
  <rect x="1120" y="255" width="300" height="110" class="box external"/><text x="1270" y="289" text-anchor="middle" class="label">Department of Motor Traffic DB</text><text x="1270" y="315" text-anchor="middle" class="tag">[External System]</text><text x="1270" y="339" text-anchor="middle" class="desc">Validates vehicle details</text>
  <rect x="1120" y="510" width="300" height="105" class="box external"/><text x="1270" y="544" text-anchor="middle" class="label">SRI-SMS</text><text x="1270" y="570" text-anchor="middle" class="tag">[External System]</text><text x="1270" y="594" text-anchor="middle" class="desc">Sends fuel transaction SMS</text>
  <path d="M360 185 H460 V390 H560" class="edge"/><text x="390" y="173" class="edgeText">Registers vehicle</text>
  <path d="M360 392 H560" class="edge"/><text x="390" y="380" class="edgeText">Registers station</text>
  <path d="M360 605 H460 V470 H560" class="edge"/><text x="382" y="593" class="edgeText">Scans QR and records fuel</text>
  <path d="M360 788 H470 V490 H560" class="edge"/><text x="390" y="776" class="edgeText">Monitors operations</text>
  <path d="M950 400 H1040 V310 H1120" class="edge"/><text x="980" y="298" class="edgeText">Validates vehicle details</text>
  <path d="M950 465 H1040 V562 H1120" class="edge"/><text x="980" y="550" class="edgeText">Sends SMS request</text>
</svg>
