<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1000" viewBox="0 0 1650 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700;fill:#222}.boundary{fill:#f5f7fa;stroke:#444;stroke-width:2}.cloud{fill:#eef6ff;stroke:#444;stroke-width:2}.subnet{fill:#fff;stroke:#7b8794;stroke-width:2}.btitle{font-size:16px;font-weight:700;fill:#333}.stitle{font-size:14px;font-weight:700;fill:#333}.box{rx:8;ry:8;stroke-width:2}.client{fill:#438dd5;stroke:#2d6ca2}.backend{fill:#1168bd;stroke:#0b4f8a}.data{fill:#f5a623;stroke:#b96e00}.queue{fill:#2e7d32;stroke:#1b5e20}.monitor{fill:#6a1b9a;stroke:#4a136b}.external{fill:#666;stroke:#444}.device{fill:#6b7280;stroke:#4b5563}.label{font-size:15px;font-weight:700;fill:#fff}.tag{font-size:12px;fill:#fff}.desc{font-size:11px;fill:#fff}.black{fill:#111}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeText{font-size:12px;fill:#222}
