<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700;fill:#222}.box{rx:8;ry:8;stroke-width:2}.device{fill:#6b7280;stroke:#4b5563}.process{fill:#1168bd;stroke:#0b4f8a}.data{fill:#f5a623;stroke:#b96e00}.event{fill:#2e7d32;stroke:#1b5e20}.external{fill:#666;stroke:#444}.label{font-size:15px;font-weight:700;fill:#fff}.tag{font-size:12px;fill:#fff}.black{fill:#111}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeText{font-size:12px;fill:#222}
    </style>
  </defs>
  <text x="700" y="48" text-anchor="middle" class="title">Data Flow - Data Ingestion Component</text>
  <rect x="60" y="260" width="190" height="90" class="box device"/><text x="155" y="294" text-anchor="middle" class="label">Sensors</text><text x="155" y="319" text-anchor="middle" class="tag">Door / motion readings</text>
  <rect x="330" y="260" width="190" height="90" class="box process"/><text x="425" y="294" text-anchor="middle" class="label">Ingestion Endpoint</text><text x="425" y="319" text-anchor="middle" class="tag">Receive reading</text>
  <rect x="600" y="260" width="190" height="90" class="box process"/><text x="695" y="294" text-anchor="middle" class="label">Validate and Normalize</text><text x="695" y="319" text-anchor="middle" class="tag">Check sensor, format data</text>
  <rect x="870" y="260" width="190" height="90" class="box process"/><text x="965" y="294" text-anchor="middle" class="label">Breach Detection</text><text x="965" y="319" text-anchor="middle" class="tag">Apply alert rules</text>
  <rect x="1140" y="150" width="200" height="90" class="box data"/><text x="1240" y="184" text-anchor="middle" class="label black">Cloud Database</text><text x="1240" y="209" text-anchor="middle" class="tag black">Store reading and alert</text>
  <rect x="1140" y="380" width="200" height="90" class="box external"/><text x="1240" y="414" text-anchor="middle" class="label">Email Service</text><text x="1240" y="439" text-anchor="middle" class="tag">Send breach alert</text>
  <path d="M250 305 H330" class="edge"/><text x="262" y="293" class="edgeText">Sensor event</text>
  <path d="M520 305 H600" class="edge"/><text x="532" y="293" class="edgeText">Raw reading</text>
  <path d="M790 305 H870" class="edge"/><text x="802" y="293" class="edgeText">Clean reading</text>
  <path d="M1060 285 H1110 V195 H1140" class="edge"/><text x="1070" y="183" class="edgeText">Persist data</text>
  <path d="M1060 325 H1110 V425 H1140" class="edge"/><text x="1070" y="413" class="edgeText">If breach, alert event</text>
</svg>
