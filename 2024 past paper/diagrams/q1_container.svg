  <rect x="1005" y="455" width="220" height="110" class="box external"/><text x="1115" y="488" text-anchor="middle" class="label">Keycloak</text><text x="1115" y="513" text-anchor="middle" class="tag">[External Container]</text><text x="1115" y="537" text-anchor="middle" class="desc">Identity and access management</text>
