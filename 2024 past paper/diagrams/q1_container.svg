  <text x="825" y="52" text-anchor="middle" class="title">C4 Level 2 - Container Diagram</text>
  <rect x="55" y="175" width="210" height="80" class="box person"/><text x="160" y="208" text-anchor="middle" class="label">User</text><text x="160" y="232" text-anchor="middle" class="tag">[Person]</text>
